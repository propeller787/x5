# =============================================================================
# 阶段 A 现场默认参数（室外基线 profile）
# 用法: ros2 run scene_node scene_node_node --params-file config/outdoor_default.yaml
# =============================================================================

decision_maker:
  ros__parameters:
    decision_rate_hz: 20.0

    # 车体几何
    robot_length: 0.88
    robot_width: 0.70
    robot_safety_margin_front: 0.10
    robot_safety_margin_side: 0.03

    # 前向距离分区（米）
    warning_zone: 1.5
    deceleration_zone: 0.8
    emergency_brake_distance: 0.3
    fixed_stopping_distance_forward: 0.25

    # 前向 TTC（统一一套，阶段 A 关闭高速剖面）
    warning_ttc: 2.0
    deceleration_ttc: 0.90
    emergency_brake_ttc: 0.30
    forward_ttc_high_speed_threshold_m_s: 0.0

    # 阶段 A：先关闭复杂补偿，建立稳定基线
    enable_obstacle_prediction: false
    enable_evasion_detection: false

    # Swept-footprint avoidance refactor: legacy / shadow / swept_footprint.
    avoidance_engine: "legacy"
    avoidance_shadow_log: true
    rollout_horizon_s: 1.2
    rollout_dt_s: 0.1
    rollout_speed_samples: 6
    rollout_angular_samples: 5
    swept_radar_timeout_s: 0.15
    swept_max_obstacles: 128
    footprint_back_extent_m: 0.25
    footprint_front_margin: 0.10
    footprint_back_margin: 0.12
    footprint_side_margin: 0.05
    footprint_obstacle_radius_default: 0.08
    comfort_clearance: 0.30
    swept_warning_ttc_s: 1.5
    swept_limiting_ttc_s: 1.0
    swept_emergency_ttc_s: 0.45
    swept_hard_stop_distance_m: 0.12
    safety_filter_angular_weight: 0.30

    # 分方向开关
    enable_forward_collision: true
    enable_lateral_collision: true
    enable_backward_collision: true

lidar_driver:
  ros__parameters:
    debug_publish: false

clustering_node:
  ros__parameters:
    debug_publish: false
