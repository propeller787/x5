# params.yaml 测试用例配置
vin: "TEST_VIN_001"
model: 1001
model_str: "test_model"
api_base_url: "http://localhost:8080"  # 本地模拟HTTP服务
mqtt:
  broker_url: "tcp://localhost:1883"   # 本地MQTT Broker
  client_id: "ota_test_001"
  username: ""
  password: ""
  insecure_skip_verify: true
can:
  use_socketcan: false  # 先Mock，后真实硬件
  ifname: "can0"
  id:
    domain: 0x3588      # 域控CAN ID
    upper: 0x0510       # 上控CAN ID
    lower: 0x0520       # 下控CAN ID
flash:
  pull_mode: false      # 先测试Push模式，后测试Pull模式
  self_flash_cmd: ""    # 自身升级先模拟
mock_can:
  outcome: "success"    # Mock CAN默认成功（可改为"fail"测试失败场景）
  step_delay_ms: 100    # Mock延迟，模拟真实传输
signature:
  private_key: ""       # 测试时可禁用签名（代码已兼容空值）