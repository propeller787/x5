syntax = "proto3";

package vehicle.cmd.exe;

//控制设备
message VehicleCmdExe {
  string sn = 3;           //车辆唯一标识
  string model = 4;       //车辆销售型号FREEGO X5 Air
  int64 timestamp = 5;      // 毫秒时间戳
  string user_id = 6;       //控制的用户id

  string cmd_id = 10;        // 控制指令唯一ID（App生成）
  string cmd = 11;           // 指令
  int32 ttl = 12;       //指令有效时间单位毫秒

  string params = 20;   //控制参数
}