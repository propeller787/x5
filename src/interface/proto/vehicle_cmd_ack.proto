syntax = "proto3";

package vehicle.cmd.ack;

//设备给服务端回执
message VehicleCmdAck {
  string sn = 1;           //车辆唯一标识
  string model = 2;       //车辆销售型号FREEGO X5 Air
  int64 timestamp = 3;      //毫秒时间戳

  string user_id = 4;     //用户id
  string cmd_id = 5;   //控制命令唯一id与exe发送时一致
  
  int32 status = 6;   //业务状态0成功 1失败 2执行中
  
  int32 error_code = 10;        //错误码status=1时该值有意义1失败 2设备离线 3无操作权限  10以上由设备定义
  string error_message = 11;  //错误描述
}