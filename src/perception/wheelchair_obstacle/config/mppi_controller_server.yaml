# 轮椅 MPPI 集成所用的 Nav2 controller_server + local_costmap 配置。
# 绕障调参版（2026-07-27）：更早横向绕障、减少“先停后绕”。上一版备份见
# mppi_controller_server_back3.yaml。
#
# local_costmap 直接通过原生 nav2 的 ObstacleLayer + InflationLayer 消费经过滤的障碍物
# 点云（来自 obstacle_cloud_filter_node 的 /perception/obstacle_points）。此前自研的
# rolling_local_costmap_node + OccupancyGridLayer 适配器已移除：标记、清除、足迹清除与膨胀
# 现在全部由 nav2 在此处完成。

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: "/odom/fused"
    controller_plugins: ["FollowPath"]

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    # progress_checker：PoseProgressChecker 同时看 xy 与 yaw。
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05
      required_movement_angle: 0.35
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # motion_model: DiffDrive / Omni / Ackermann / WheelchairDiffDrive
      motion_model: "WheelchairDiffDrive"

      WheelchairDiffDriveConstraints:
        # 一阶执行器延迟（模拟 handle ramp）；0 表示无额外滞后（仅 ax/az 限幅）
        vx_time_constant_s: 0.25
        wz_time_constant_s: 0.20
        # |vx|>vx_turn_eps 时 |wz|<=|vx|/min_turning_r；低速允许原地大 wz
        min_turning_r: 0.35
        vx_turn_eps: 0.05

      # 20 Hz 控制器 -> model_dt 必须 >= 控制周期；此处取相等。
      model_dt: 0.05
      # 须大于 MPPI 正常帧间隔（~0.18s@5Hz），小于回零 cancel→resend（~0.5s）。
      reset_period: 0.35
      # idle reset（>reset_period）或 optimizer fail 后下一帧（即使间隔<reset_period）：
      # 用 odom robot_speed 填满 control_sequence，使 rollout 噪声均值与实测速度一致。
      reset_seed_from_speed: true
      # side_pass 退出后首次 idle reset：|vx| 下限（与 cmd_vel_safety_gate side_pass_crawl_vx_mps 对齐）
      reset_seed_min_vx_after_side_pass_enable: true
      reset_seed_min_vx_mps: 0.10
      narrow_gate_side_pass_mode_topic: "/mppi/narrow_gate_side_pass_mode"
      time_steps: 60
      batch_size: 800
      iteration_count: 1

      # 速度包络上限；档位 vx 限速仅在 cmd_vel_safety_gate 输出侧 clamp（MPPI 保持大包络规划）。
      vx_max: 5.0
      vx_min: 0.001
      vx_min_lateral: -0.50
      rocker_sector_vx_min_enable: true
      rocker_forward_sector_topic: "/mppi/rocker_forward_sector_mode"
      gear_vx_cap_enable: true
      gear_vx_cap_topic: "/mppi/gear_vx_max_mps"
      wz_density_cap_enable: true
      wz_density_cap_topic: "/mppi/wz_density_cap_rps"
      vy_max: 0.0
      wz_max: 1.20
      # 加速度约束：rollout 与最优 control sequence 按 model_dt 逐步限幅，使 MPPI 选轨迹时
      # 即考虑加/减速度（ax_min 为负值表示减速度上限）。与 cmd_vel_safety_gate 的
      # vx_accel_max_mps2 对齐；减速度可单独设大以便提前规划制动。
      # 改动前（未引入 ax/ay/az 约束时）：yaml 无此五项，MPPI 仅 ConstraintCritic 限 vx/vy/wz。
      # 引入后若 yaml 不写，代码默认 ax_max/ay_max=3.0、ax_min/ay_min=-3.0、az_max=3.5 (m/s²或rad/s²)。
      ax_max: 1.0      # 默认 3.0
      ax_min: -1.5     # 默认 -3.0
      ay_max: 1.0      # 默认 3.0
      ay_min: -1.0     # 默认 -3.0
      az_max: 3.5      # 默认 3.5

      # 略减 vx 采样、加大 wz 采样，使 rollout 更多探索“低速+大角速度”绕障轨迹。
      vx_std: 0.35
      vy_std: 0.0
      wz_std: 0.42

      temperature: 0.25
      gamma: 0.01
      retry_attempt_limit: 2
      regenerate_noises: false
      # 打开后，MPPI 会把候选轨迹与最优轨迹（“Optimal Trajectory” 命名空间）发布到
      # /trajectories(visualization_msgs/MarkerArray)，并把跟踪的局部路径发布到
      # /controller_server/transformed_global_plan(nav_msgs/Path)，
      # 供 RViz2 显示 MPPI 的输出路径。会略增 CPU，仅用于调试。
      visualize: false

      TrajectoryVisualizer:
        trajectory_step: 15
        time_step: 3

      # 1.1.20 没有 TrajectoryValidator 插件体系；最优轨迹的校验由各 critic 自身处理。

      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
        - "VelocityDeadbandCritic"

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      # consider_footprint=true，因为 base_link 位于靠后位置（前悬伸 f=0.935，后悬伸
      # r=0.2）：内切圆近似仅约 0.20 m（受后部限制），会使很长的前部得不到保护。
      # 全多边形检测更耗 CPU：若 controller_frequency 掉到 20 Hz 以下，请减小
      # batch_size/time_steps 或调高 CostCritic.trajectory_point_step。
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.5
        critical_cost: 420.0
        collision_cost: 500000.0
        consider_footprint: true
        near_goal_distance: 2.5
        # 近终点（距 path 终点 <= near_goal_distance）是否仍累加膨胀梯度软代价 pose_cost。
        # false（默认）：仅保留碰撞 + INSCRIBED 硬罚，便于末端对准/原地转向；true：与远场一致避障。
        near_goal_repulsive_cost_enable: true
        inflation_layer_name: "inflation_layer"

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.5
        threshold_to_consider: 6.0

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.5
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5
        max_path_occupancy_ratio: 0.06
        trajectory_point_step: 8
        threshold_to_consider: 0.4
        offset_from_furthest: 6
        use_path_orientations: true

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 5
        threshold_to_consider: 1.2

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        offset_from_furthest: 4
        threshold_to_consider: 0.4
        max_angle_to_furthest: 1.2
        # 1.1.20 读取 forward_preference（bool），而非 1.4.x 的 "mode"（int）。
        # vx_min<0 允许倒车；forward_preference=true 偏好前进。
        forward_preference: true

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.5
        threshold_to_consider: 0.5

      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        deadband_velocities: [0.02, 0.0, 0.02]

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: "odom"
      robot_base_frame: "base_link"
      transform_tolerance: 0.10

      rolling_window: true
      # 以机器人为中心、对称的滚动窗口（与 odom 对齐）。若 MPPI 需要更多前向预视，可对称放大。
      # 注意：width/height 在 nav2 costmap_2d 中是整数参数 —— 不要写成 4.0（double），否则
      # Costmap2DROS 会因 InvalidParameterType 中止。
      # 6x6 滚动窗口 -> 每个方向 3 m 范围（与 obstacle_max_range 3.0 匹配），使 MPPI 能看得
      # 够远，从而在高挡位下刹车。
      # 更大 = 更多 CPU/RAM；若循环无法保持 20 Hz，则退回到 4。
      width: 8
      height: 8
      resolution: 0.05
      always_send_full_costmap: true
      track_unknown_space: false

      # 6 顶点双梯形（凸字）：后段宽体 + 前段脚托收窄。分节线 x=0.685，前缘 f=0.935
      # （脚托半宽 0.17 m），后缘 r=0.2，后段半宽 w=0.34。对齐 safety_node 双梯形几何。
      footprint: "[[-0.2, 0.33], [0.685, 0.34], [0.935, 0.18], [0.935, -0.18], [0.685, -0.34], [-0.2, -0.33]]"
      # padding 由 joystick_local_path 按挡位发布到 /local_costmap/footprint
      footprint_padding: 0.0

      plugins: ["obstacle_layer", "inflation_layer"]

      # 方案 B：每周期整图重建的 ObstacleLayer 变体（wheelchair_obstacle 包内的自定义插件）。
      # 每个更新周期先清空本层栅格再用当前帧重建，使障碍物离开后立即消失（不依赖射线是否
      # 恰好穿过旧格子）。直接从经过滤的障碍物点云进行标记/清除，上游的
      # obstacle_cloud_filter_node 已完成 range/z/ROI/自遮挡/孤立点/体素滤波。
      # 注意：整图重建会丢失时间记忆，单帧漏检会导致障碍瞬时闪烁；若实测出现闪烁，
      # 需退回原生 ObstacleLayer 或引入时间衰减（keep_time）策略。
      obstacle_layer:
        plugin: "wheelchair_obstacle::RebuildObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        pass_mode_topic: "/mppi/narrow_gate_pass_mode"
        combination_method: 1              # 1 = 取最大值
        observation_sources: obstacle_cloud
        obstacle_cloud:
          topic: /perception/obstacle_points
          data_type: "PointCloud2"
          sensor_frame: "base_link"        # 合并点云的公共坐标系；射线清除的原点
          marking: true
          clearing: true
          # 只保留最新一帧；整图重建时也确保只用当前帧障碍。
          observation_persistence: 0.0
          expected_update_rate: 0.2        # 点云低于约 2 Hz 时告警
          min_obstacle_height: -0.30       # 与滤波器 z_min 对齐
          max_obstacle_height: 0.80        # 与滤波器 z_max 对齐
          obstacle_min_range: 0.05
          obstacle_max_range: 5.00
          raytrace_min_range: 0.05
          raytrace_max_range: 5.00
          inf_is_valid: false

      inflation_layer:
        plugin: "wheelchair_obstacle::PassModeInflationLayer"
        enabled: true
        pass_mode_topic: "/mppi/narrow_gate_pass_mode"
        pass_mode_resolution_enable: true
        pass_mode_resolution: 0.02
        pass_mode_inflation_radius: 0.005
        # 由 footprint 自动推导的内切半径现在约为 0.20 m（受较短的后悬伸 r=0.2 限制）；
        # inflation_radius 必须 >= 该值。
        inflation_radius: 6.8
        cost_scaling_factor: 12.0
        inflate_unknown: false

