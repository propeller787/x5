cmd_vel_safety_gate_node:
  ros__parameters:
    # 总开关：false 时跳过门控逻辑，仅按 bypass_source 直通输出（测试用）。
    gate_enable: true
    # gate_enable=false 时有效：handle=/handle/control，cmd_vel=/cmd_vel
    # bypass_source: "handle"
    bypass_source: "cmd_vel"

    cmd_vel_in: "/cmd_vel"
    cmd_vel_out: "/nav/control"
    # 行进意图（proximity 限速方向）：来自固件已按挡位缩放的摇杆速度。
    handle_control_topic: "/handle/control"
    # 原始摇杆（CAN 0x226, interface/msg/Joystick, rocker_x/y in [-100, 100]）。
    # 松手软/急停：jlp release_soft_stop_enable 时由 jlp 发 topic；否则 gate legacy 判定。
    # /handle/control 来自固件 ramp/滤波，有 100~500 ms 滞后；原始摇杆反映意图更快。
    rocker_topic: "/sensor/joystick"
    # |rocker_x|, |rocker_y| <= rocker_deadband 即视为回正（原始单位）。
    rocker_deadband: 5.0
    # 超过该时长没收到摇杆消息也判失效（fail-safe 停车）。
    rocker_timeout: 0.30

    # --- 摇杆扇区意图滤波（左右扇区禁反向转弯）---
    # 扇区划分见 joystick_local_path.yaml（/mppi/rocker_intent_zone）
    # 【前】禁倒车由 MPPI vx_min 保证；【左】禁右转(wz<0)；【右】禁左转(wz>0)。
    rocker_sector_intent_filter_enable: true
    rocker_intent_zone_topic: "/mppi/rocker_intent_zone"
    rocker_intent_zone_timeout: 0.30
    # 障碍物点云：proximity 限速 + wz 密度分档。
    obstacle_points_topic: "/perception/obstacle_points"
    # Nav2 Humble 的 controller_server 在 /cmd_vel 上发布 geometry_msgs/Twist
    #（TwistStamped / enable_stamped_cmd_vel 仅在 Iron/Jazzy+ 上才有）。订阅类型必须
    # 与发布者一致，否则 DDS 会丢弃每一条消息，门控会把 /nav/control 锁定为 0。
    input_type: "twist"

    cmd_timeout: 0.30
    # /cmd_vel 超过 cmd_timeout 仍沿用最后一帧，直到 cmd_hold_timeout 才 fail-safe 停车。
    # MPPI ~7–20 Hz 时避免 50 Hz 门控周期性清零（急刹）。
    cmd_hold_timeout: 0.50
    publish_rate_hz: 50.0

    # --- 接近速度上限 ---
    # base_link -> 保险杠的前/后悬伸（取自 footprint 的 f / r）。
    front_overhang: 0.935
    rear_overhang: 0.2
    # 完全停止时保险杠与障碍物之间保留的间隙。
    standoff: 0.08
    brake_decel: 2.2
    # 把速度限制为 sqrt(2*brake_decel*clearance)，使轮椅在距最近障碍物 standoff 处减速停下。
    proximity_speed_cap: true
    # 行进方向扇区的半角（弧度）。
    sector_half_angle: 0.20
    # 障碍物点云比此值更旧 -> proximity fail-safe。
    obstacle_timeout: 0.5
    # |linear.x| 低于此值视为未平移（不计前向威胁）。
    intent_eps: 0.03

    wz_max: 1.30
    # 倒车线速度上限 (m/s)，仅对 linear.x < 0 生效。
    vx_reverse_max: 0.5

    # 开阔走廊巡航仍订阅 /vlago/car/info 的 gear；档位 vx 上限由 jlp 发布 topic，gate 订阅后做输出 clamp
    car_info_topic: "/vlago/car/info"
    gear_default_index: 3
    gear_vx_cap_enable: true
    gear_vx_cap_topic: "/mppi/gear_vx_max_mps"

    # --- 开阔走廊巡航（仅 3/4 挡；默认关，实车验证后开）---
    open_corridor_cruise_mode_topic: "/mppi/open_corridor_cruise_mode"
    open_corridor_cruise_min_gear: 3
    open_corridor_cruise_jerk_mps3: 0.2
    open_corridor_cruise_accel_mps2: 0.5
    open_corridor_cruise_front_half_deg: 30.0
    open_corridor_cruise_exit_hold_frames: 30
    open_corridor_cruise_pre_exit_jerk_mps3: 0.2
    open_corridor_cruise_pre_exit_decel_mps2: 0.6
    open_corridor_cruise_pre_exit_exit_speed_kph: 2.0   # 前向 pre_exit 缓行目标，避免减到 0 后负加速度穿零倒车
    open_corridor_cruise_pre_exit_mode_topic: "/mppi/open_corridor_cruise_pre_exit_mode"
    open_corridor_cruise_exit_jerk_mps3: 0.3
    open_corridor_cruise_exit_decel_mps2: 1.2
    open_corridor_cruise_exit_early_speed_kph: 1.5
    open_corridor_cruise_exit_early_below_mppi_enable: true
    open_corridor_cruise_mppi_handoff_enable: true   # 正式退出结束后 jerk 向 MPPI vx 接手
    open_corridor_cruise_mppi_handoff_jerk_mps3: 0.2
    open_corridor_cruise_mppi_handoff_accel_mps2: 0.5
    open_corridor_cruise_mppi_handoff_max_sec: 0.6
    open_corridor_cruise_mppi_handoff_vx_eps: 0.08    # |handoff_vx - mppi_vx| 以内结束接手
    proximity_speed_cap_during_cruise_exit: true       # pre_exit/exit/handoff 阶段 proximity 限速兜底
    open_corridor_cruise_gear_wz_max_rps: [0.55, 0.75, 0.95, 0.75]
    open_corridor_cruise_gear_vx_max_kph: [2.0, 3.0, 5.0, 6.0]

    # --- 松手软停 legacy（jlp release_soft_stop_enable=false 时 gate 本地判定）---
    release_soft_stop_enable: false
    release_soft_stop_radius: 0.8
    release_soft_stop_decel: 1.0
    release_soft_stop_wz_decel: 2.0

    # --- 松手软停 jlp topic（release_soft_stop_enable=true 时 jlp 判定；gate 低通向零）---
    release_soft_stop_mode_topic: "/mppi/release_soft_stop_mode"
    stick_release_halt_topic: "/mppi/stick_release_halt"
    release_soft_stop_time_constant_s: 0.30
    release_soft_stop_angular_time_constant_s: 0.30
    release_soft_stop_vel_eps: 0.02
    release_soft_stop_brake_check_enable: true
    release_soft_stop_standoff: 0.08
    release_soft_stop_brake_sector_half_angle: 0.30

    # MPPI fail 软停（/cmd_vel 突变为 0 且摇杆仍出死区）：减速度 ramp
    # 安全区：左/右/前 forward strip 各 check_depth 内无障碍（同 proximity_side_pass）
    # 左右角 strip 在 check_depth 外再探 side_probe_depth，用于 wz 策略：
    #   转向朝向探知侧障碍 -> wz=0；单侧有障 -> 向避让方向 avoid_wz_accel 加速转向
    mppi_fail_soft_stop_enable: true
    mppi_fail_soft_stop_check_depth_m: 0.02
    mppi_fail_soft_stop_side_probe_depth_m: 0.20
    mppi_fail_soft_stop_jerk_mps3: 0.40
    mppi_fail_soft_stop_decel_mps2: 1.2
    mppi_fail_soft_stop_avoid_wz_accel: 0.80
    mppi_fail_soft_stop_avoid_wz_max: 0.75
    # fallback 最长持续帧数（@publish_rate_hz）；超时立即输出 0 并退出 soft-stop。0=不限
    mppi_fail_soft_stop_max_frames: 30

    # --- 过窄门模式（订阅 /mppi/narrow_gate_pass_mode）---
    # vx 限速；更信任原始摇杆：前推禁倒退、后拉禁前进，左右推禁反向转向
    narrow_gate_pass_mode_topic: "/mppi/narrow_gate_pass_mode"
    narrow_gate_vx_max: 0.20
    narrow_gate_rocker_intent_filter_enable: true
    narrow_gate_rocker_forward_min: 5.0   # |rocker_x| 超过此值视为前/后意图（原始单位）
    narrow_gate_rocker_lateral_min: 5.0   # |rocker_y| 超过此值视为左右意图；+y=左转
    # 退出窄门 pass_mode 后线性放开 vx 上限，避免突然加速（仅限制前进 vx>0）
    narrow_gate_exit_ramp_enable: true
    narrow_gate_exit_ramp_sec: 2.0          # 从 narrow_gate_vx_max 爬升到 target 的时长
    narrow_gate_exit_ramp_vx_target: 1.50   # 爬升结束时的 vx 上限；之后不再额外限速

    # --- 侧身穿行 crawl legacy（side_pass_crawl_enable=false 时 gate 处理）---
    # true 时 crawl 由 jlp 发布 /cmd_vel，本节 legacy 逻辑不生效
    side_pass_crawl_enable: false
    narrow_gate_side_pass_mode_topic: "/mppi/narrow_gate_side_pass_mode"
    # 前向：footprint 前三段 y 带，x 基准 0.685/0.935/0.685 各向 +x 延伸 check_depth
    side_pass_crawl_check_depth_m: 0.06
    side_pass_crawl_forward_strip_x: [0.685, 0.935, 0.685]
    side_pass_crawl_forward_strip_y_min: [0.2, -0.2, -0.34]
    side_pass_crawl_forward_strip_y_max: [0.34, 0.2, -0.2]
    # 后向：后缘 x=-0.2 三段 y 带，各向 -x 延伸 check_depth；后拉且 strip 无障碍时负 vx crawl
    side_pass_crawl_reverse_enable: false
    side_pass_crawl_rear_strip_x: [-0.2, -0.2, -0.2]
    side_pass_crawl_rear_strip_y_min: [0.2, -0.2, -0.34]
    side_pass_crawl_rear_strip_y_max: [0.34, 0.2, -0.2]
    # 侧向：footprint 左/右外缘三段 x 不重叠 — 后段/宽体转角/鼻尖（y_edge 对应各段外缘 |y|）
    side_pass_crawl_lateral_strip_x_min: [-0.2, 0.685, 0.7]
    side_pass_crawl_lateral_strip_x_max: [0.685, 0.7, 0.935]
    side_pass_crawl_lateral_strip_y_edge: [0.33, 0.34, 0.20]
    side_pass_crawl_vx_mps: 0.10
    side_pass_crawl_wz_rps: 0.10
    side_pass_crawl_rocker_forward_min: 5.0
    side_pass_crawl_rocker_lateral_min: 5.0
    # side_pass 两阶段：内层 check_depth 净空 + 外侧 20cm 有障 → crawl wz；外侧 20cm 净空 → avoid turn 加速
    # 外侧 probe 深度同 mppi_fail_soft_stop_side_probe_depth_m（内层基准为 side_pass_crawl_check_depth_m）
    side_pass_avoid_turn_enable: true
    # side_pass 退出：max_frames 内 max(crawl,MPPI)；超时后 hold last_out 直至 |MPPI vx|>crawl_vx
    # hold 期间按 last_out 运动方向检查 side_pass_crawl_check_depth 条带净空
    # MPPI reset seed 下限见 mppi_controller_server FollowPath.reset_seed_min_vx_mps（须与此 crawl_vx 一致）
    side_pass_exit_transition_enable: true
    side_pass_exit_transition_frames: 50

    # --- 侧边障碍平滑限速（点云 base_link；仅 1 档生效，默认关）---
    side_speed_limit_enable: false
    side_speed_limit_gear_only: 1
    side_speed_limit_body_half_width_m: 0.34
    side_speed_limit_x_min_m: 0.33
    side_speed_limit_x_max_m: 1.00
    side_speed_limit_dist_m: [0.05, 0.10, 0.20, 0.40]
    side_speed_limit_vx_mps: [0.28, 0.60, 1.20, 2.40]
    side_speed_limit_decel_mps2: 0.60
    side_speed_limit_wz_tighten_enable: false

    # --- 摇杆幅度比例限速（|rocker|/100 → 挡位 vx/wz 上限比例）---
    # 出死区后最小比例 stick_vx_min_ratio；推满杆为 1.0。MPPI 仍可在比例以下减速避障。
    stick_vx_scale_enable: true
    stick_vx_min_ratio: 0.15
    stick_wz_scale_enable: true

    # --- 线速度加速限制（仅限制加速；减速/急停/软停车逻辑不变）---
    vx_accel_limit_enable: true
    vx_accel_max_mps2: 1.0

    # --- 输出 wz 微调 trick（/nav/control 发布前；|wz|>intent_eps 时叠加）---
    left_turn_wz_trick_enable: true
    left_turn_wz_trick_offset_deg_s: 1.0        # 非零 wz 额外 +1°/s（停车 wz≈0 不加）
