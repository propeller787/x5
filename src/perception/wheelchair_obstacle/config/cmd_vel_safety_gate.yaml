cmd_vel_safety_gate_node:
  ros__parameters:
    # 总开关：false 时跳过门控逻辑，仅按 bypass_source 直通输出（测试用）。
    gate_enable: true
    # gate_enable=false 时有效：handle=/handle/control，cmd_vel=/cmd_vel
    # bypass_source: "handle"
    bypass_source: "cmd_vel"

    cmd_vel_in: "/cmd_vel"
    cmd_vel_out: "/nav/control"
    # 行进意图（proximity 限速方向）：来自固件已按挡位缩放的摇杆速度。
    handle_control_topic: "/handle/control"
    # 原始摇杆（CAN 0x226, interface/msg/Joystick, rocker_x/y in [-100, 100]）。
    # 松手时：周边 release_soft_stop_radius 内无障碍点云 → 软停车；否则急停。
    # /handle/control 来自固件 ramp/滤波，有 100~500 ms 滞后；原始摇杆反映意图更快。
    rocker_topic: "/sensor/joystick"
    # |rocker_x|, |rocker_y| <= rocker_deadband 即视为回正（原始单位）。
    rocker_deadband: 5.0
    # 超过该时长没收到摇杆消息也判失效（fail-safe 停车）。
    rocker_timeout: 0.30
    # 障碍物点云：proximity 限速 + wz 密度分档。
    obstacle_points_topic: "/perception/obstacle_points"
    # Nav2 Humble 的 controller_server 在 /cmd_vel 上发布 geometry_msgs/Twist
    #（TwistStamped / enable_stamped_cmd_vel 仅在 Iron/Jazzy+ 上才有）。订阅类型必须
    # 与发布者一致，否则 DDS 会丢弃每一条消息，门控会把 /nav/control 锁定为 0。
    input_type: "twist"

    cmd_timeout: 0.30
    # /cmd_vel 超过 cmd_timeout 仍沿用最后一帧，直到 cmd_hold_timeout 才 fail-safe 停车。
    # MPPI ~7–20 Hz 时避免 50 Hz 门控周期性清零（急刹）。
    cmd_hold_timeout: 0.50
    publish_rate_hz: 50.0

    # --- 接近速度上限 ---
    # base_link -> 保险杠的前/后悬伸（取自 footprint 的 f / r）。
    front_overhang: 0.935
    rear_overhang: 0.2
    # 完全停止时保险杠与障碍物之间保留的间隙。
    standoff: 0.08
    brake_decel: 2.2
    # 把速度限制为 sqrt(2*brake_decel*clearance)，使轮椅在距最近障碍物 standoff 处减速停下。
    proximity_speed_cap: false
    # 行进方向扇区的半角（弧度）。
    sector_half_angle: 0.30
    # 障碍物点云比此值更旧 -> proximity / wz 分档 fail-safe（wz 强制 DENSE）。
    obstacle_timeout: 0.5
    # |linear.x| 低于此值视为未平移（不计前向威胁）。
    intent_eps: 0.03

    wz_max: 1.30
    # 倒车线速度上限 (m/s)，仅对 linear.x < 0 生效。
    vx_reverse_max: 0.5

    # --- 按挡位限制线速度（订阅 /vlago/car/info 的 gear 字段）---
    car_info_topic: "/vlago/car/info"
    gear_vx_cap_enable: true
    gear_default_index: 3
    gear_vx_max_kph: [2.0, 3.0, 4.0, 6.0]   # 1–4 挡对应 kph，内部换算为 m/s

    # --- 松手软停车（周边无障碍时）---
    release_soft_stop_enable: true
    # base_link 下该半径(m)内无障碍点时，松手按减速度 ramp 至零；否则急停。
    release_soft_stop_radius: 0.8
    release_soft_stop_decel: 1.0
    release_soft_stop_wz_decel: 2.0
    release_soft_stop_vel_eps: 0.02

    # --- 按 obstacle_points 周边密度分三档限制角速度（带迟滞）---
    # 调试：/cmd_vel_safety_gate_node/wz_density_tier (0=OPEN, 1=MODERATE, 2=DENSE)
    wz_density_cap_enable: true
    density_check_radius: 1.2
    # [OPEN, MODERATE, DENSE] 角速度上限 (rad/s)。0.524 ≈ 30°/s，0.785 ≈ 45°/s
    wz_density_caps_rps: [1.30, 0.785, 0.524]
    obstacle_count_engage_moderate: 12
    obstacle_count_release_open: 6
    obstacle_count_engage_dense: 40
    obstacle_count_release_moderate: 28
    wz_density_min_dwell: 0.4

    # --- 过窄门模式（订阅 /mppi/narrow_gate_pass_mode）---
    # vx 限速；更信任原始摇杆：前推禁倒退、后拉禁前进，左右推禁反向转向
    narrow_gate_pass_mode_topic: "/mppi/narrow_gate_pass_mode"
    narrow_gate_vx_max: 0.20
    narrow_gate_rocker_intent_filter_enable: true
    narrow_gate_rocker_forward_min: 5.0   # |rocker_x| 超过此值视为前/后意图（原始单位）
    narrow_gate_rocker_lateral_min: 5.0   # |rocker_y| 超过此值视为左右意图；+y=左转
    # 退出窄门 pass_mode 后线性放开 vx 上限，避免突然加速（仅限制前进 vx>0）
    narrow_gate_exit_ramp_enable: true
    narrow_gate_exit_ramp_sec: 2.0          # 从 narrow_gate_vx_max 爬升到 target 的时长
    narrow_gate_exit_ramp_vx_target: 1.50   # 爬升结束时的 vx 上限；之后不再额外限速
