joystick_local_path_node:
  ros__parameters:
    path_generation_mode: "spatial_range"

    joystick_topic: "/sensor/joystick"
    car_info_topic: "/vlago/car/info"
    odom_topic: "/odom/fused"
    intent_path_topic: "/mppi/local_intent_path"
    follow_path_action: "follow_path"

    global_frame: "odom"
    controller_id: "FollowPath"
    goal_checker_id: "general_goal_checker"

    rocker_deadband: 5.0
    joystick_timeout: 0.30
    odom_timeout: 0.30

    # 极坐标同心圆（前向 300° 扇区）：stick_r=|rocker|/100，stick_theta=atan2(ry,rx)
    # 前向 goal = stick_r * gear_forward_range_m * (cos,sin)(theta)，yaw 渐变到 stick_theta
    # gear_forward_range_m: [0.60, 1.00, 1.50, 2.50]
    gear_forward_range_m: [1.60, 2.00, 2.50, 3.50]
    # 后向 60° 扇区（带 ±10° 回滞）：笛卡尔 goal，path yaw 保持当前 heading，MPPI 用 vx<0 倒车避障
    gear_back_range_m: [1.60, 2.00, 2.50, 3.50]
    gear_lateral_range_m: [0.60, 0.80, 1.00, 1.50]
    # 纯左右（|rx| 死区）原地转：wz = (ry/100) * gear_lateral_wz_max
    gear_lateral_wz_max: [0.55, 0.75, 0.95, 1.15]
    horizon: 1.8
    gear_default_index: 3

    # 前向 300° / 后向 60° 选择路径模式；|角|=150° 边界 ±10° 回滞
    # backward_reverse_path_enable: 后向扇区倒车避障（path yaw 不变，MPPI vx<0，不原地掉头）
    backward_reverse_path_enable: true
    forward_sector_deg: 300.0
    backward_sector_deg: 60.0
    sector_hysteresis_deg: 10.0

    path_interpolation_steps: 20
    min_goal_distance_m: 0.12
    goal_resend_xy_delta_m: 0.05
    goal_resend_yaw_delta: 0.08
    # cancel 后等待再 resend；须 > FollowPath.reset_period（0.35s）以触发 Optimizer reset。
    mppi_reset_quiet_sec: 0.40
    send_rate_hz: 5.0

    # 按挡位发布 /local_costmap/footprint（1–4 挡 -> 1–4 cm padding）。
    # costmap 侧 footprint_padding 须为 0，避免重复膨胀。
    footprint_publish_enable: true
    footprint_topic: "/local_costmap/footprint"
    footprint_base: "[[-0.2, 0.33], [0.685, 0.34], [0.935, 0.20], [0.935, -0.20], [0.685, -0.34], [-0.2, -0.33]]"
    gear_footprint_padding_m: [0.01, 0.02, 0.03, 0.04]

    # path 完成后按障碍物截断：中心线左右各半车宽+挡位 padding 走廊内最近障距（默认关，实车验证后开）
    path_obstacle_limit_enable: false
    path_obstacle_stop_margin_m: 0.20
    path_obstacle_min_keep_m: 1.5
    path_obstacle_limit_skip_pass_mode: true
    path_obstacle_limit_skip_in_place: true

    # 4 挡且 base_link 前方走廊净空：跳过 MPPI，由 safety_gate 按挡位 vx 巡航（默认关）
    path_open_cruise_enable: true
    path_open_cruise_min_gear: 4
    path_open_cruise_gear_front_half_deg: [45.0, 45.0, 40.0, 30.0]
    path_open_cruise_gear_extra_padding_m: [0.0, 0.0, 0.20, 0.30]
    path_open_cruise_outer_far_m: 2.5
    path_open_cruise_pre_exit_confirm_frames: 2
    path_open_cruise_confirm_frames: 3
    path_open_cruise_reenter_cooldown_frames: 20
    path_open_cruise_exit_confirm_frames: 2
    path_open_cruise_topic: "/mppi/open_corridor_cruise_mode"
    path_open_cruise_pre_exit_topic: "/mppi/open_corridor_cruise_pre_exit_mode"

    # 松手软停：摇杆回中 + 半径内无障碍 → 发 mode 并跳过 MPPI；否则 halt（默认关，实车验证后开）
    release_soft_stop_enable: true
    release_soft_stop_radius: 0.5
    release_soft_stop_topic: "/mppi/release_soft_stop_mode"
    stick_release_halt_topic: "/mppi/stick_release_halt"

    # 窄门 detect/track/pass：仅正对（body +x 双侧切片）；斜穿见 gate_side_pass。
    gate_path_enable: true
    obstacle_points_topic: "/perception/obstacle_points"
    gate_local_radius_m: 1.40
    gate_detect_mode: "bilateral"
    gate_width_min_m: 0.75
    gate_width_max_m: 1.00
    gate_scan_dist_min_m: 0.15        # 允许 x≈0.20m 贴脸门框
    gate_pillar_mode_enable: true
    gate_min_side_boundary_m: 0.38   # pillar_mode 下不生效
    gate_pillar_symmetry_ratio_min: 0.55  # pillar_mode 下 min/max(左右柱 inward 距) 须 >= 此比，拒非对称假门
    gate_min_side_points: 1
    gate_stick_forward_min: 0.20
    gate_lateral_stick_forward_min: 0.08   # 侧身穿行 intent 用
    gate_center_y_deadband_m: 0.18
    gate_stick_lateral_min: 0.08
    gate_intent_lateral_ratio_min: 0.20
    gate_intent_cross_slack_m: 0.18
    gate_intent_angle_delta_max: 0.45
    gate_opening_depth_m: 0.25
    # detect/track：接近门槛时可稍高速识别（车身可能已部分入门）；pass_mode 进入仍须 creep。
    gate_detect_speed_max_mps: 0.55
    gate_detect_confirm_sec: 0.80
    gate_detect_hold_sec: 0.60
    # pass_mode 进入/保持：|v|<=gate_creep_speed_max_mps（蠕行脱困）
    gate_creep_speed_max_mps: 0.20
    gate_creep_stick_forward_min: 0.01
    gate_creep_stick_min: 0.10
    gate_creep_intent_angle_max: 0.95
    gate_creep_intent_cross_slack_m: 0.35
    gate_creep_intent_angle_delta_max: 0.95
    gate_hold_sec: 0.25
    gate_confirm_sec: 1.50
    gate_confirmed_hold_sec: 0.60
    # 窄门记忆：车身全长两侧 lateral_band 外有点云 + |v|>min_speed + confirm_frames 帧
    gate_memory_max_count: 5
    gate_memory_merge_radius_m: 1.00
    gate_memory_lateral_band_m: 0.20
    gate_memory_min_speed_mps: 0.30
    gate_memory_confirm_frames: 5
    # body_x / half_width <= 0 时从 footprint 自动推导
    gate_memory_body_x_min_m: -1.0
    gate_memory_body_x_max_m: -1.0
    gate_memory_half_width_m: -1.0
    gate_memory_min_side_points: 1
    gate_memory_rearm_frames: 3
    # 每次通过后加权更新门框/中心：0=按 1/pass_count（第2次0.5，第3次0.33…），>0=固定新样本权重
    gate_memory_update_alpha: 0.0

    # --- 侧身穿行 crawl（记忆门 / proximity；默认关，实车验证后开）---
    # false: jlp 仅发 mode topic，crawl 仍由 safety_gate legacy 处理
    # true: jlp 发布 side_pass_crawl_cmd_vel_topic 并跳过 MPPI
    side_pass_crawl_enable: true
    side_pass_crawl_cmd_vel_topic: "/cmd_vel"
    side_pass_crawl_check_depth_m: 0.06
    side_pass_crawl_forward_strip_x: [0.685, 0.935, 0.685]
    side_pass_crawl_forward_strip_y_min: [0.2, -0.2, -0.34]
    side_pass_crawl_forward_strip_y_max: [0.34, 0.2, -0.2]
    side_pass_crawl_rear_strip_x: [-0.2, -0.2, -0.2]
    side_pass_crawl_rear_strip_y_min: [0.2, -0.2, -0.34]
    side_pass_crawl_rear_strip_y_max: [0.34, 0.2, -0.2]
    side_pass_crawl_lateral_strip_x_min: [-0.2, 0.685, 0.7]
    side_pass_crawl_lateral_strip_x_max: [0.685, 0.7, 0.935]
    side_pass_crawl_lateral_strip_y_edge: [0.33, 0.34, 0.20]
    side_pass_crawl_vx_mps: 0.10
    side_pass_crawl_wz_rps: 0.10
    side_pass_crawl_rocker_forward_min: 5.0
    side_pass_crawl_rocker_lateral_min: 5.0
    narrow_gate_side_pass_mode_topic: "/mppi/narrow_gate_side_pass_mode"

    # 侧身穿行 crawl：边框距记忆门中心 < trigger_dist + 摇杆指向穿行方向
    # 匹配记忆门时：中心取 odom 记忆，门宽/左右柱取记忆中心 x 附近当前点云双侧切片
    gate_side_pass_enable: true
    gate_side_pass_min_pass_count: 2   # pass_count > 2
    gate_side_pass_trigger_dist_m: 0.20
    gate_side_pass_stick_forward_min: 0.08
    gate_side_pass_stick_lateral_min: 0.08
    gate_side_pass_stick_angle_max: 0.95
    gate_side_pass_max_speed_mps: 0.10   # 触发时 |v| 须低于此值
    gate_side_pass_body_clear_m: 0.35
    gate_side_pass_width_min_m: 0.25   # 侧穿专用；正对 detect 仍用 gate_width_min_m=0.75
    # 进入侧穿：左/右/前 forward strip（15cm 深度）任一有 point 即可，确认贴障需脱困
    gate_side_pass_enter_forward_cloud_enable: true
    gate_side_pass_enter_check_depth_m: 0.15
    gate_side_pass_enter_forward_strip_x: [0.685, 0.935, 0.685]
    gate_side_pass_enter_forward_strip_y_min: [0.2, -0.2, -0.34]
    gate_side_pass_enter_forward_strip_y_max: [0.34, 0.2, -0.2]
    # 自然退出（bisector/border）前：左右前角 forward strip 须无点云，逻辑同 cmd_vel side_pass_crawl_check_depth_m
    gate_side_pass_exit_forward_clear_enable: true
    gate_side_pass_exit_check_depth_m: 0.10
    gate_side_pass_exit_forward_strip_x: [0.685, 0.685]
    gate_side_pass_exit_forward_strip_y_min: [0.2, -0.34]
    gate_side_pass_exit_forward_strip_y_max: [0.34, -0.2]

    # 贴障侧穿：不依赖记忆窄门；左/右/前 10cm 有障 + |v|<0.1 + 摇杆出死区，点云 10 帧（~1s@10Hz）进入
    # 退出：footprint 含后向外扩 15cm 内无障碍，连续 5 帧后回 MPPI
    proximity_side_pass_enable: true
    proximity_side_pass_enter_depth_m: 0.10
    proximity_side_pass_exit_margin_m: 0.12
    proximity_side_pass_max_speed_mps: 0.05
    proximity_side_pass_confirm_frames: 20
    proximity_side_pass_exit_confirm_frames: 3

    # 过窄门模式：匹配窄门且车头中心距门中心 <= gate_pass_mode_enter_m 时激活。
    # gate_pass_front_center_x_m 为 base_link 下前向参考点（约车头中心）。
    # 零 footprint padding；costmap inflation/resolution 由 PassModeInflationLayer 处理。
    # /mppi/narrow_gate_pass_mode 通知 safety_gate：vx<=0.2m/s；停车条件与全局相同（松手等）。
    # pass_mode 内不因 odom 超速退出；进入仍要求 |v|<=gate_creep_speed_max_mps（detect 可更快）。
    # pass_mode 内用 odom 锚点持续更新 gate 距离；门中心 body_x <= body_clear 时自动退出。
    # body_clear 须明显小于后悬 -0.2m，等整车进入门洞后再退（-0.45 ≈ 后缘后再 25cm）。
    gate_pass_mode_enter_m: 0.80
    gate_pass_front_center_x_m: 0.85
    gate_pass_mode_exit_m: 0.95
    gate_pass_mode_body_clear_x_m: -0.45
    gate_pass_mode_hold_sec: 0.25
    narrow_gate_pass_mode_topic: "/mppi/narrow_gate_pass_mode"
    # RViz：当前窄门（黄/绿/紫）+ 记忆门（蓝球，odom 坐标）
    gate_marker_enable: true
    gate_marker_topic: "/mppi/gate_markers"
    gate_memory_publish_enable: true
    gate_memory_topic: "/mppi/gate_memory"
    gate_memory_state_topic: "/mppi/gate_memory/state"

    # velocity_integration 模式专用
    control_topic: "/handle/control"
    lin_deadband: 0.02
    ang_deadband: 0.02
    turn_assist_vx: 0.08
    control_timeout: 0.30
    dt: 0.05
