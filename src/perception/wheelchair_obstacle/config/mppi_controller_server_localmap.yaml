# 轮椅 MPPI + localmap_occupymap 集成配置。
# local_costmap 仅保留 ExternalOccupymapLayer，订阅 /localmap/occupymap_raw。
# 占据融合 / 膨胀 / 盲区保持由 occupymap_node 负责。
#
# 回退 Nav2 内嵌 RebuildObstacleLayer：use_localmap_costmap:=false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: "/odom/fused"
    controller_plugins: ["FollowPath"]

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    goal_checker_plugins: ["general_goal_checker"]

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"

      model_dt: 0.05
      time_steps: 56
      batch_size: 1200
      iteration_count: 1

      vx_max: 5.0
      vx_min: -0.90
      vy_max: 0.0
      wz_max: 1.20

      vx_std: 0.35
      vy_std: 0.0
      wz_std: 0.42

      temperature: 0.25
      gamma: 0.01
      retry_attempt_limit: 1
      regenerate_noises: false
      visualize: true

      TrajectoryVisualizer:
        trajectory_step: 15
        time_step: 3

      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
        - "VelocityDeadbandCritic"

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.5
        critical_cost: 300.0
        collision_cost: 500000.0
        consider_footprint: true
        near_goal_distance: 0.5
        # 膨胀已在 occupymap 内完成，无 Nav2 inflation_layer
        inflation_layer_name: ""

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.5
        threshold_to_consider: 1.5

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.5
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5
        max_path_occupancy_ratio: 0.06
        trajectory_point_step: 4
        threshold_to_consider: 0.4
        offset_from_furthest: 6
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 5
        threshold_to_consider: 1.2

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        offset_from_furthest: 4
        threshold_to_consider: 0.4
        max_angle_to_furthest: 1.2
        forward_preference: true

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.5
        threshold_to_consider: 0.5

      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        deadband_velocities: [0.02, 0.0, 0.02]

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: "odom"
      robot_base_frame: "base_link"
      transform_tolerance: 0.10

      rolling_window: true
      # 与 occupymap 8×8 m 窗口对齐
      width: 8
      height: 8
      resolution: 0.05
      always_send_full_costmap: true
      track_unknown_space: false

      footprint: "[[0.935, 0.34], [0.935, -0.34], [-0.2, -0.34], [-0.2, 0.34]]"
      footprint_padding: 0.03

      plugins: ["external_occupymap_layer"]

      external_occupymap_layer:
        plugin: "wheelchair_obstacle::ExternalOccupymapLayer"
        enabled: true
        costmap_topic: /localmap/occupymap_raw
        costmap_update_topic: /localmap/occupymap_updates
