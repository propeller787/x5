# 轮椅 MPPI + localmap_occupymap 集成配置。
# local_costmap 仅保留 ExternalOccupymapLayer，订阅 /localmap/occupymap_raw。
# 占据融合 / 膨胀 / 盲区保持由 occupymap_node 负责。
#
# 回退 Nav2 内嵌 RebuildObstacleLayer：use_localmap_costmap:=false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: "/odom/fused"
    controller_plugins: ["FollowPath"]

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    # 摇杆短弧/原地转向时 xy 位移小，SimpleProgressChecker 会误报无进展。
    # PoseProgressChecker：xy 或 yaw 任一在 movement_time_allowance 内达标即视为有进展。
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05
      required_movement_angle: 0.35
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"

      model_dt: 0.05
      # MPPI 有效 ~5–7 Hz（dt≈0.18s）时 reset_period 必须 > 正常帧间隔，否则每帧 reset
      # 卡顿（bag_113125: 330 次/59s）。取 0.35s：正常运行不 reset；回零 cancel~0.58s 后仍 reset。
      reset_period: 0.35
      time_steps: 56
      batch_size: 1200
      iteration_count: 1

      vx_max: 5.0
      vx_min: -0.50
      vy_max: 0.0
      wz_max: 1.20

      vx_std: 0.35
      vy_std: 0.0
      wz_std: 0.42

      temperature: 0.25
      gamma: 0.01
      retry_attempt_limit: 1
      regenerate_noises: false
      visualize: true

      TrajectoryVisualizer:
        trajectory_step: 15
        time_step: 3

      critics:
        - "ConstraintCritic"
        - "CostCritic"
        # ==== 窄门中心线引导 cost 试验版 BEGIN ====
        - "GateCenterlineCritic"
        # ==== 窄门中心线引导 cost 试验版 END ====
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
        - "VelocityDeadbandCritic"

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.5
        critical_cost: 300.0
        collision_cost: 500000.0
        consider_footprint: true
        near_goal_distance: 0.5
        # 膨胀已在 occupymap 内完成，无 Nav2 inflation_layer
        inflation_layer_name: ""

      # ==== 窄门中心线引导 cost 试验版 BEGIN ====
      GateCenterlineCritic:
        # 一键开关：true=启用窄门中心线引导，false=完全关闭（也可 launch 传 gate_centerline_enable:=false）
        enabled: true
        cost_power: 1
        critic_weight: 20.0
        center_weight: 3.0
        heading_weight: 0.3
        gate_width_min_m: 0.80
        gate_width_max_m: 1.50
        gate_min_distance_m: 0.35
        gate_max_distance_m: 1.60
        scan_y_abs_m: 1.60
        scan_x_step_m: 0.05
        scan_y_step_m: 0.05
        center_clear_half_width_m: 0.16
        center_clear_x_margin_m: 0.12
        active_x_band_m: 0.45
        active_hold_s: 0.30
        stage_prepare_ratio: 0.35
        stage_turn_ratio: 0.20
        stage_exit_ratio: 0.45
        stage_far_center_scale: 0.35
        stage_prepare_center_scale: 0.95
        stage_turn_center_scale: 2.10
        stage_exit_center_scale: 0.90
        stage_far_heading_scale: 0.55
        stage_prepare_heading_scale: 1.05
        stage_turn_heading_scale: 1.70
        stage_exit_heading_scale: 0.95
        stage_weight_gain: 1.80
        critical_mix_ratio: 0.45
        stick_forward_min: 0.15
        stick_lateral_min: 0.08
        gate_center_y_deadband_m: 0.18
        intent_lateral_ratio_min: 0.20
        obstacle_cost_threshold: 200
        trajectory_point_step: 4
        joystick_topic: "/sensor/joystick"
        debug_topic: "/mppi/gate_centerline_critic/debug"
        debug_publish_period_s: 0.10
      # ==== 窄门中心线引导 cost 试验版 END ====

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.5
        threshold_to_consider: 1.5

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.5
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5
        max_path_occupancy_ratio: 0.06
        trajectory_point_step: 4
        threshold_to_consider: 0.4
        offset_from_furthest: 6
        # true: follow path pose yaw (required for in-place turn paths with identical xy).
        use_path_orientations: true

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 5
        threshold_to_consider: 1.2

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        offset_from_furthest: 4
        threshold_to_consider: 0.4
        max_angle_to_furthest: 1.2
        forward_preference: true

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.5
        threshold_to_consider: 0.5

      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        deadband_velocities: [0.02, 0.0, 0.02]

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: "odom"
      robot_base_frame: "base_link"
      transform_tolerance: 0.10

      rolling_window: true
      # 与 occupymap 8×8 m 窗口对齐
      width: 8
      height: 8
      resolution: 0.05
      always_send_full_costmap: true
      track_unknown_space: false

      footprint: "[[-0.2, 0.34], [0.685, 0.31], [0.935, 0.17], [0.935, -0.17], [0.685, -0.31], [-0.2, -0.34]]"
      footprint_padding: 0.0

      plugins: ["external_occupymap_layer"]

      external_occupymap_layer:
        plugin: "wheelchair_obstacle::ExternalOccupymapLayer"
        enabled: true
        costmap_topic: /localmap/occupymap_raw
        costmap_update_topic: /localmap/occupymap_updates
