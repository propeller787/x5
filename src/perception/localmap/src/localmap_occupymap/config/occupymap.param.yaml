/**:
  ros__parameters:
    odom_topic: /odom/fused
    cloud_topic: /perception/obstacle_points
    output_topic: /localmap/occupymap
    output_raw_topic: /localmap/occupymap_raw
    output_update_topic: /localmap/occupymap_updates

    # odom 滚动窗口：前后/左右各 4m（8m x 8m，size_x=160 size_y=160）
    map_extent_forward_m: 4.0
    map_extent_backward_m: 4.0
    map_extent_left_m: 4.0
    map_extent_right_m: 4.0
    # base_link 点云观测范围：前后 4m、左右 3m（不变）
    observe_extent_forward_m: 4.0
    observe_extent_backward_m: 4.0
    observe_extent_left_m: 3.0
    observe_extent_right_m: 3.0
    resolution_m: 0.05
    map_frame: odom
    robot_base_frame: base_link
    costmap_layer: master
    inflation_radius_m: 0.55
    inscribed_radius_m: 0.35
    cost_scaling_factor: 10.0
    track_unknown_space: false

    vehicle_front_x_m: 0.9
    vehicle_rear_x_m: -0.1
    vehicle_half_width_m: 0.5
    blind_zone_retention_sec: 10.0

    hit_probability: 0.55
    miss_probability: 0.49
    insert_free_space: true

    stationary_linear_thresh_mps: 0.05
    stationary_angular_thresh_rps: 0.05
    stationary_retention_sec: 10.0

    min_z_m: -0.5
    max_z_m: 2.0
    max_range_m: 30.0
