# =============================================================================
# lidar_imu_fusion 节点配置文件
#
# 节点名: three_lidar_imu_fusion
# 作用: 把左/右/后三个 2D 激光雷达 (10 Hz) + IMU (100 Hz) 融合为
#       一帧去畸变的 LaserScan，输出到 target_frame 坐标系。
#
# 本文件中的默认值与头文件 (lidar_imu_fusion_node.hpp) 中的默认值完全对齐，
# 确保 `ros2 run` 裸跑与 `ros2 launch` 行为一致。
# =============================================================================

three_lidar_imu_fusion:
  ros__parameters:

    # ---------------------------------------------------------------------------
    # 话题与坐标系
    # ---------------------------------------------------------------------------

    # 三路 2D 激光雷达输入话题 (sensor_msgs/msg/LaserScan, 10 Hz)
    left_scan_topic: "/scan/left"
    right_scan_topic: "/scan/right"
    back_scan_topic: "/scan/back"

    # IMU 输入话题 (sensor_msgs/msg/Imu, 100 Hz)
    # IMU 角速度单位必须为 rad/s（ROS 标准）
    imu_topic: "/imu"

    # 融合结果输出话题
    output_scan_topic: "/perception/lidar_fusion/scan"

    # 融合输出坐标系：所有点最终变换到该坐标系并栅格化
    # 默认 base_link（机器人本体坐标系）
    target_frame: "base_link"

    # ---------------------------------------------------------------------------
    # 坐标变换策略
    # ---------------------------------------------------------------------------

    # 是否使用 TF 查询 target_frame <- laser_frame_* / imu_link
    # 关闭后仅用下面的静态外参
    use_tf_transforms: true

    # TF 查询失败时是否回退到静态外参 (下面的 left_lidar/right_lidar/back_lidar/imu)
    # true: TF 缺失也能工作（需标定外参）
    # false: TF 缺失则跳过该传感器
    fallback_to_static_transforms: true

    # ---------------------------------------------------------------------------
    # IMU 去畸变
    # ---------------------------------------------------------------------------

    # 是否启用 IMU 旋转去畸变
    # 关闭后输出不做运动补偿（适合静止或低速场景）
    enable_imu_deskew: true

    # true : 严格模式。同步组在 IMU 覆盖整个融合区间前不处理，
    #        覆盖中段缺失则丢弃整组。适合要求高质量去畸变的场景。
    # false: 宽松模式。IMU 覆盖不足的 beam 仍保留在输出中但不去畸变，
    #        并统计告警。适合 IMU 可能间歇可用的场景。
    require_imu_for_publish: false

    # IMU 样本保留时长 (秒)。超过该时长的旧样本从缓冲中删除。
    # 需 ≥ 融合区间长度（默认 2 s 足够覆盖 10 Hz 雷达的 ~0.1 s 扫描周期）
    imu_queue_duration_sec: 2.0

    # IMU 角速度端点外推上限 (秒)。
    # 当 beam 时刻略早于首条 IMU 或略晚于末条 IMU 时，允许在该容差内用边界值外推。
    # 超出则认为覆盖不足。
    max_imu_extrapolation_sec: 0.03

    # ---------------------------------------------------------------------------
    # 三雷达近似同步
    # ---------------------------------------------------------------------------

    # 三路雷达 header.stamp 允许的最大时间跨度 (秒)。
    # 超过该跨度的三元组不参与匹配。默认 0.03 s (30 ms)。
    # 增大可容忍更大的雷达间时钟抖动，但可能跨帧匹配。
    max_sync_slop_sec: 0.1

    # 每条雷达缓存队列最大长度。
    # 默认 10 帧 (10 Hz 下约 1 s)。过大增加匹配搜索开销，过小易丢帧。
    scan_queue_size: 10

    # 已同步待处理组队列上限。
    # 同步成功的三元组先入此队列，再由 drainPendingScans 处理。
    # 超出则丢最旧组并告警。默认 5。
    max_pending_scan_sets: 5

    # scan_time 字段缺失/非法时的兜底时长 (秒)，同时作为 scan_time 上限裁剪基准。
    default_scan_time: 0.1

    # ---------------------------------------------------------------------------
    # 输出 LaserScan 栅格参数
    # ---------------------------------------------------------------------------

    # 输出角度区间 [angle_min, angle_max]，默认 [-π, π] 全向
    output_angle_min: -3.141592653589793
    output_angle_max: 3.141592653589793

    # 输出角度分辨率 (弧度/格)。
    # 必须 > 0；非正或非有限值会被重置为 π/720 (约 0.25°)。
    # 不会从输入雷达自动推导，避免三雷达分辨率不同时 bin 数被异常放大。
    # 0.004363323129985824 ≈ π/720 ≈ 0.25°
    output_angle_increment: 0.004363323129985824

    # 输出有效距离区间 (米)。
    # beam 距离落在此区间外的不写入输出。
    output_range_min: 0.05
    output_range_max: 10.0

    # 融合后无有效点时是否仍发布空 scan (所有 bin = inf)。
    # false: 无有效点则不发布；true: 发布空帧便于下游统一处理时间轴。
    publish_empty_scan: false

    # ---------------------------------------------------------------------------
    # 静态外参兜底: target_frame <- lidar_frame
    #
    # 仅当 use_tf_transforms=true 且 TF 查询失败、fallback_to_static_transforms=true 时使用。
    # 部署前必须用标定结果替换下面的全 0 值，否则三雷达会重叠在 target_frame 原点。
    # 字段含义: 雷达坐标系原点在 target_frame 中的平移 (x,y,z, 米)
    #          与从 target_frame 到雷达坐标系的 RPY 欧拉角 (roll,pitch,yaw, 弧度)
    # ---------------------------------------------------------------------------

    left_lidar:
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
    right_lidar:
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
    back_lidar:
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

    # ---------------------------------------------------------------------------
    # 静态外参兜底: target_frame <- imu_frame
    #
    # 仅用其旋转部分 (getBasis()) 把 IMU 角速度旋到 target_frame。
    # 平移部分对角速度变换无意义（角速度是矢量，与位置无关）。
    # ---------------------------------------------------------------------------

    imu:
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
