# ydlidar ROS2 驱动节点参数配置文件
# 适用于 Tmini 型号激光雷达
ydlidar_ros2_driver_node:
  ros__parameters:
    # 串口设备路径，激光雷达连接的串口设备文件
    # 常见路径：/dev/ttyUSB0, /dev/ttyUSB1, /dev/ttyACM0 等
    port: /dev/ttyS4

    # ROS 坐标系名称，激光雷达数据发布时使用的 frame_id
    # 用于在 tf 树中标识激光雷达的坐标系
    frame_id: laser_frame

    # 忽略角度数组，用于过滤指定角度范围内的扫描数据
    # 格式：起始角度,结束角度;起始角度,结束角度 (例如: "0,30;330,360")
    # 空字符串表示不忽略任何角度
    ignore_array: ""

    # 串口波特率，与激光雷达通信的串口数据传输速率
    # Tmini 型号通常使用 230400 波特率
    baudrate: 230400

    # 激光雷达类型标识符
    # 1 表示 Tmini 系列激光雷达
    lidar_type: 1

    # 设备类型标识符
    # 0 表示默认设备类型
    device_type: 0

    # 是否启用强度信息
    # true: 发布激光点的强度信息（反射强度）
    # false: 不发布强度信息，所有点的强度值为 0
    intensity: true

    # 强度数据的位数
    # 8: 使用 8 位强度数据（0-255）
    # 16: 使用 16 位强度数据（0-65535）
    intensity_bit: 8

    # 是否为单通道模式
    # false: 双通道模式（正常扫描）
    # true: 单通道模式（仅使用一个扫描通道）
    isSingleChannel: false

    # 扫描频率，单位：Hz
    # 表示激光雷达每秒完成的扫描次数
    # 10.0 表示每秒 10 次完整扫描
    frequency: 12.0

    # 采样率，控制扫描点的密度
    # 数值越大，扫描点越密集，但可能影响性能
    # 通常取值范围：1-9
    sample_rate: 4

    # 异常检测计数阈值
    # 连续检测到异常数据的次数超过此值时，触发异常处理
    # 用于提高系统的鲁棒性
    abnormal_check_count: 4

    # 是否使用固定分辨率
    # true: 固定角度分辨率，扫描点角度间隔固定
    # false: 自适应分辨率，根据扫描频率调整
    fixed_resolution: true

    # 是否反转角度方向
    # true: 反转扫描角度方向（顺时针/逆时针互换）
    # false: 保持原始角度方向
    reversion: true

    # 是否翻转扫描数据
    # true: 翻转扫描数据的顺序
    # false: 保持原始扫描顺序
    inverted: true

    # 是否自动重连
    # true: 当连接断开时自动尝试重新连接
    # false: 连接断开后不自动重连
    auto_reconnect: true

    # 是否支持电机 DTR 控制
    # DTR (Data Terminal Ready) 用于控制激光雷达电机的启动/停止
    # false: 不支持或不需要 DTR 控制
    # true: 支持通过 DTR 信号控制电机
    support_motor_dtr: false

    # 最大扫描角度，单位：度
    # 激光雷达扫描的最大角度范围
    # 180.0 表示从 -180 度到 +180 度的完整 360 度扫描
    angle_max: 180.0

    # 最小扫描角度，单位：度
    # 激光雷达扫描的最小角度范围
    # -180.0 表示从 -180 度开始扫描
    angle_min: -180.0

    # 最大测量距离，单位：米
    # 激光雷达能够测量的最大距离
    # 超过此距离的测量值将被视为无效
    range_max: 12.0

    # 最小测量距离，单位：米
    # 激光雷达能够测量的最小距离
    # 小于此距离的测量值将被视为无效或不可靠
    range_min: 0.03

    # 无效距离是否视为无穷大
    # false: 无效距离值保持为 0 或 NaN
    # true: 无效距离值设置为 inf（无穷大）
    invalid_range_is_inf: false

    # 是否启用调试模式
    # false: 正常模式，输出较少日志信息
    # true: 调试模式，输出详细的调试信息，用于排查问题
    debug: false
